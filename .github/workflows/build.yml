name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ValueStreamMapper.sln
      - name: Build
        run: dotnet build ValueStreamMapper.sln --configuration Release --no-restore
      - name: Test (core + headless UI)
        run: dotnet test ValueStreamMapper.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publish win-x64 (self-contained, single file)
        run: >
          dotnet publish src/VsmApp/VsmApp.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/win-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ValueStreamMapper-win-x64
          path: publish/win-x64
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/VsmApp.Tests/bin/Release/net8.0/screenshots

  msix:
    runs-on: windows-latest
    needs: windows
    env:
      # Identity must match the values App Store Connect's Windows equivalent — Partner Center —
      # assigns under Product management → Product identity. Set them as repository variables
      # (Settings → Secrets and variables → Actions → Variables). Until then, test values are used.
      IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'VincenzoRenzo.ValueStreamMapper' }}
      IDENTITY_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Vincenzo Renzo' }}
      PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'Vincenzo Renzo' }}
      PACKAGE_VERSION: ${{ vars.MSIX_VERSION || '1.0.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish app for packaging (self-contained, multi-file)
        run: >
          dotnet publish src/VsmApp/VsmApp.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false -p:DebugType=none -o package/app
      - name: Stage manifest and assets
        shell: pwsh
        run: |
          Copy-Item packaging/Assets -Destination package/app/Assets -Recurse
          $m = Get-Content packaging/AppxManifest.xml -Raw
          $m = $m.Replace('IDENTITY_NAME', $env:IDENTITY_NAME).Replace('IDENTITY_PUBLISHER', $env:IDENTITY_PUBLISHER)
          $m = $m.Replace('PUBLISHER_DISPLAY_NAME', $env:PUBLISHER_DISPLAY_NAME).Replace('PACKAGE_VERSION', $env:PACKAGE_VERSION)
          Set-Content package/app/AppxManifest.xml $m -Encoding utf8
          Write-Host "Identity: $env:IDENTITY_NAME / $env:IDENTITY_PUBLISHER / $env:PACKAGE_VERSION"
      - name: Locate Windows SDK tools
        shell: pwsh
        run: |
          $kits = "C:\Program Files (x86)\Windows Kits\10\bin"
          $ver = Get-ChildItem $kits -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1
          $bin = Join-Path $ver.FullName "x64"
          Write-Host "Using SDK tools in $bin"
          "SDKBIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/out | Out-Null
          & "$env:SDKBIN\makeappx.exe" pack /d package/app /p package/out/ValueStreamMapper.msix /o
      - name: Sign MSIX
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          if ($env:PFX_BASE64) {
            Write-Host "Signing with the certificate from repository secrets"
            [IO.File]::WriteAllBytes("package/cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          } else {
            Write-Host "No MSIX_PFX_BASE64 secret: creating a self-signed certificate for sideload testing"
            $cert = New-SelfSignedCertificate -Type Custom -Subject $env:IDENTITY_PUBLISHER -KeyUsage DigitalSignature `
              -FriendlyName "Value Stream Mapper test signing" -CertStoreLocation Cert:\CurrentUser\My `
              -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
            $env:PFX_PASSWORD = "sideload"
            $pwd = ConvertTo-SecureString -String $env:PFX_PASSWORD -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath package/cert.pfx -Password $pwd | Out-Null
            Export-Certificate -Cert $cert -FilePath package/out/ValueStreamMapper-TestCertificate.cer | Out-Null
            $note = @(
              "This MSIX is signed with a self-signed TEST certificate (no MSIX_PFX_BASE64 secret was configured).",
              "To sideload it on a PC:",
              "  1. Double-click ValueStreamMapper-TestCertificate.cer -> Install Certificate -> Local Machine ->",
              "     Place all certificates in the following store -> Trusted People (or Trusted Root Certification Authorities).",
              "  2. Double-click ValueStreamMapper.msix -> Install.",
              "Packages submitted to the Microsoft Store do NOT need this: the Store signs them with Microsoft's certificate."
            )
            Set-Content package/out/HOW-TO-INSTALL.txt ($note -join "`r`n")
          }
          if ($env:PFX_BASE64) {
            & "$env:SDKBIN\signtool.exe" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f package/cert.pfx /p $env:PFX_PASSWORD package/out/ValueStreamMapper.msix
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & "$env:SDKBIN\signtool.exe" verify /pa /v package/out/ValueStreamMapper.msix
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            & "$env:SDKBIN\signtool.exe" sign /fd SHA256 /f package/cert.pfx /p $env:PFX_PASSWORD package/out/ValueStreamMapper.msix
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "Signed with the self-signed test certificate; chain verification skipped (it is untrusted by design)."
          }
          Remove-Item package/cert.pfx -Force
          exit 0
      - name: Upload MSIX
        uses: actions/upload-artifact@v4
        with:
          name: ValueStreamMapper-msix
          path: package/out
