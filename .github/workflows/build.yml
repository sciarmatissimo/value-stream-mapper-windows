name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore ValueStreamMapper.sln
      - name: Build
        run: dotnet build ValueStreamMapper.sln --configuration Release --no-restore
      - name: Test (core + headless UI)
        run: dotnet test ValueStreamMapper.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publish win-x64 (self-contained, single file)
        run: >
          dotnet publish src/VsmApp/VsmApp.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
          -o publish/win-x64
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: ValueStreamMapper-win-x64
          path: publish/win-x64
      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: tests/VsmApp.Tests/bin/Release/net8.0/screenshots
